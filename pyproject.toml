# priority = "primary"

[[tool.poetry.source]]
name = "djtt_cmoser"
url = "https://git.cmoser.eu/api/packages/django/pypi/simple"
priority = "primary"


[[tool.poetry.source]]
name = "djtt_c-moser"
url = "https://git.c-moser.at/api/packages/django-tinytools/pypi/simple"
priority = "primary"

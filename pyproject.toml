[project]
name="django-tinyuser"
dynamic=["version"]

description = "A small minimal user for django using allauth-integration"
authors = [
    {name = "Christian Moser",email = "dev@c-moser.at"}
]
maintainers = [
	{name = "Christian Moser",email = "dev@c-moser.at"}
]
license = "0BSD"
license_files = [
	"LICENSE",
	"LICENSE.md"
]

readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "django (>=6.0.5,<7.0)",
    "django-allauth[openid,saml,socialaccount] (>=65.16.1,<66.0.0)",
    "pillow (>=12.1.1,<13.0.0)",
    "django-environ (>=0.12.0,<0.13.0)",
    "django-widget-tweaks (>=1.5.0,<2.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "django-extensions (>=4.1,<5.0)",
    "django-invitations (>=2.1.0,<3.0.0)",
    "django-oauth-toolkit (>=3.2.0,<4.0.0)",
    "markdown (>=3.10.2,<4.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "orjson (>=3.11.9,<4.0.0)",
    "dj-templates (>=0.0.25,<0.1.0)",
    "fido2 (>=2.2.1,<3.0.0)",
]

[tool.black]
line-length = 120
exclude = "(.data/|.git/|.venv/|venv/|.hg/|wiki/)"
target-version = ["py312","py313", "py314"]

[tool.poetry]
version = "0.0.1"
package-mode = true
packages = [
    {include = "dj_tinyuser"},
]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
dj-templates = {source = "djtt_c-moser"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "django-browser-reload (>=1.21.0,<2.0.0)",
    "django-debug-toolbar (>=6.3.0,<7.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]
uswgi = [
    "uwsgi[emperor] (>=2.0.31,<3.0.0)",
]
daphne = [
    "daphne (>=4.2.1,<5.0.0)"
]
postgresql = [
    "psycopg2 (>=2.9.12,<3.0.0)"
]
mysql = [
    "mysqlclient (>=2.2.8,<3.0.0)"
]
uwsgi = [
    "uwsgi (>=2.0.31,<3.0.0)"
]
doc = [
    "sphinx[latex,pdf] (>=9.1.0,<10.0.0)",
    "recommonmark (>=0.7.1,<0.8.0)",
    "sphinx-rtd-theme (>=3.1.0,<4.0.0)",
    "groundwork-sphinx-theme (>=1.1.1,<2.0.0)"
]
api = [
    "django-rest-framework (>=0.1.0,<0.2.0)",
    "drf-spectacular[sidecar] (>=0.30.0,<0.31.0)"
]
sso = [
    "django-allauth[sso] (>=65.17.0,<66.0.0)"
]

[[tool.poetry.source]]
name = "pypi-public"
url = "https://pypi.org/simple"
priority = "primary"


